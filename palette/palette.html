<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#0B111C;font-family:"Noto Sans TC",sans-serif;color:#E8ECF3;overflow:hidden}
#gl{position:fixed;inset:0}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:13px;color:#C6CFDD;white-space:nowrap;text-shadow:0 1px 2px #000;pointer-events:none}
.lab b{color:#fff;font-weight:600}
.lab.left{transform:translate(-100%,-50%);text-align:right}
.lab small{color:#8C98AE;font-family:ui-monospace,Menlo,monospace;font-size:11px}
#title{position:absolute;left:24px;top:18px;font-size:16px;font-weight:600}
#title small{display:block;font-weight:400;color:#8C98AE;font-size:12px;margin-top:2px}
#cols{position:absolute;left:300px;top:70px;display:flex;gap:0;font-size:12px;color:#8C98AE}
#cols span{width:150px;text-align:center}
</style></head><body>
<canvas id="gl"></canvas>
<div id="title">3D 色票 v1 · 深色固定<small>每個語意角色三階：dim（背景／未啟用）· base（正常）· hot（目前／高亮，加白色邊線）· 右側兩欄：線框版（不活躍）與管線版（連線束）</small></div>
<div id="labels"></div>
<script src="../vendor/three.min.js"></script>
<script>
const ROLES=[
 ['signal','訊號 / token / Query / 算力',   '#8A6A2C','#F2B544','#FFC53A'],
 ['memory','記憶體 / KV / Key / HBM',       '#34507F','#5B8DEF','#78A6FF'],
 ['state','狀態 / LLM / latent / Value',    '#5E4F8F','#A98BFF','#BFA6FF'],
 ['flow','連線 / 工具 / 共享 / 正常路徑',    '#2A6B60','#3FBFA8','#5FE0C6'],
 ['alert','爆炸 / 錯誤 / 通訊 / 逐出',       '#7E3A35','#F0665C','#FF7F76'],
 ['moe','MoE 專家 / 稀疏',                   '#7A4A7E','#D97BD2','#EE92E8'],
 ['inactive','不活躍 / 空 page / 未算',       '#2E394B','#4A5870','#7E8CA3'],
 ['structure','外殼 / 座標 / 說明線',         '#3A4658','#7F8BA0','#C4CEDD'],
];
const T=THREE; const canvas=document.getElementById('gl');
const r=new T.WebGLRenderer({canvas,antialias:true}); r.setSize(innerWidth,innerHeight,false); r.setPixelRatio(1); r.shadowMap.enabled=true; r.shadowMap.type=T.PCFSoftShadowMap; r.setClearColor(0x0B111C);
const scene=new T.Scene(); const cam=new T.PerspectiveCamera(30,innerWidth/innerHeight,0.1,100); cam.position.set(0.5,7,25); cam.lookAt(0.5,0.0,0);
scene.add(new T.HemisphereLight(0xBFD4FF,0x0B111C,0.75)); const key=new T.DirectionalLight(0xffffff,0.9); key.position.set(6,12,8); key.castShadow=true; key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-14;key.shadow.camera.right=14;key.shadow.camera.top=10;key.shadow.camera.bottom=-10; key.shadow.bias=-0.0005; scene.add(key);
const ground=new T.Mesh(new T.PlaneGeometry(60,60),new T.ShadowMaterial({opacity:0.45})); ground.rotation.x=-Math.PI/2; ground.position.y=-4.6; ground.receiveShadow=true; scene.add(ground);
const grid=new T.GridHelper(60,60,0x1B2536,0x16202E); grid.position.y=-4.59; scene.add(grid);
const mat=(c,glow=0.3)=>new T.MeshStandardMaterial({color:new T.Color(c),emissive:new T.Color(c),emissiveIntensity:glow,roughness:0.7,metalness:0.05});
const labels=document.getElementById('labels'); const items=[];
const addLabel=(pos,html,cls='lab')=>{ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; labels.appendChild(d); items.push({pos,d}); };
const X0=-5.2, ROWH=0.95;
ROLES.forEach((R,i)=>{ const [id,desc,dim,base,hot]=R; const y=3.2-i*ROWH;
  addLabel(new T.Vector3(X0-1.2,y,0),`<b>${id}</b>　${desc}<br><small>${dim} · ${base} · ${hot}</small>`,'lab left');
  [[dim,0.12,'dim'],[base,0.28,'base'],[hot,0.38,'hot']].forEach(([c,g,n],k)=>{ const x=X0+k*1.9; const m=new T.Mesh(new T.BoxGeometry(0.55,0.55,0.55),mat(c,g)); m.position.set(x,y,0); m.castShadow=true; scene.add(m);
    if(n==='hot'){ const e=new T.LineSegments(new T.EdgesGeometry(m.geometry),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9})); e.position.copy(m.position); scene.add(e); }
    if(i===0) addLabel(new T.Vector3(x,y+0.75,0),`<small>${n}</small>`); });
  // wireframe column
  const w=new T.Mesh(new T.BoxGeometry(0.55,0.55,0.55),new T.MeshBasicMaterial({color:new T.Color(base),wireframe:true,transparent:true,opacity:0.7})); w.position.set(X0+3*1.9+0.4,y,0); scene.add(w); if(i===0) addLabel(new T.Vector3(w.position.x,y+0.75,0),`<small>wire</small>`);
  // tube column (beam)
  const tube=new T.Mesh(new T.CylinderGeometry(0.06,0.06,1.3,10),mat(base,0.35)); tube.rotation.z=Math.PI/2; tube.position.set(X0+4*1.9+0.9,y,0); tube.castShadow=true; scene.add(tube); if(i===0) addLabel(new T.Vector3(tube.position.x,y+0.75,0),`<small>beam</small>`);
  // sphere column (state/node)
  const sp=new T.Mesh(new T.SphereGeometry(0.3,24,16),mat(base,0.3)); sp.position.set(X0+5*1.9+1.2,y,0); sp.castShadow=true; scene.add(sp); if(i===0) addLabel(new T.Vector3(sp.position.x,y+0.75,0),`<small>node</small>`);
});
// demo strip: a mini tower with edges + a token row to see composition
const towerX=X0+6*1.9+2.6; const types=['#3FBFA8','#F2B544','#F2B544','#F2B544','#D97BD2','#5B8DEF']; types.forEach((c,i)=>{ const m=new T.Mesh(new T.BoxGeometry(1.6,0.28,1.0),mat(c,i===2?0.5:0.3)); m.position.set(towerX,-3.9+i*0.38,0); m.castShadow=true; scene.add(m); if(i===2){ const e=new T.LineSegments(new T.EdgesGeometry(m.geometry),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9})); e.position.copy(m.position); scene.add(e);} });
addLabel(new T.Vector3(towerX,-1.3,0),`<small>塔 · 目前層加白邊</small>`);
for(let i=0;i<6;i++){ const lit=i<3; const m=lit?new T.Mesh(new T.BoxGeometry(0.42,0.42,0.42),mat(i===2?'#FFD27A':'#F2B544',i===2?0.5:0.3)):new T.Mesh(new T.BoxGeometry(0.42,0.42,0.42),new T.MeshBasicMaterial({color:0x4A5870,wireframe:true,transparent:true,opacity:0.6})); m.position.set(towerX-1.4+i*0.56,0.6,0); m.castShadow=lit; scene.add(m); if(i===2){ const e=new T.LineSegments(new T.EdgesGeometry(m.geometry),new T.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9})); e.position.copy(m.position); scene.add(e);} }
addLabel(new T.Vector3(towerX,1.35,0),`<small>token 列 · 已生成 / 目前(白邊) / 未生成(線框)</small>`);
addLabel(new T.Vector3(towerX,-4.4,0.9),`<small>地面：ShadowMaterial 0.45 + 網格 #1B2536</small>`);
function project(){ items.forEach(({pos,d})=>{ const v=pos.clone().project(cam); d.style.left=((v.x+1)/2*innerWidth)+'px'; d.style.top=((-v.y+1)/2*innerHeight)+'px'; }); }
r.render(scene,cam); project(); window.__done=true;
</script></body></html>
